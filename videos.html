<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./videos.css">
</head>
<body>
    <header class="bg-dark text-white text-center py-3">
        <h1 class="display-4">Galería de Videos</h1>
    </header>

    <main class="container mt-5">
        <div id="videoCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <!-- Primer video -->
                <div class="carousel-item active">
                    <div class="d-flex flex-column align-items-center">
                        <iframe id="video-player" width="100%" height="400" src="https://www.youtube.com/embed/H3NmsJ9gZTM" title="YouTube video" frameborder="0" allowfullscreen></iframe>
                        <div class="mt-3">
                            <img class="video-thumb rounded" src="./cdob.webp" alt="Miniatura del video 1" youtube="https://www.youtube.com/embed/H3NmsJ9gZTM">
                        </div>
                    </div>
                </div>
                <!-- Segundo video -->
                <div class="carousel-item">
                    <div class="d-flex flex-column align-items-center">
                        <iframe id="video-player" width="100%" height="400" src="https://www.youtube.com/embed/VIDEO_ID" title="YouTube video" frameborder="0" allowfullscreen></iframe>
                        <div class="mt-3">
                            <img class="video-thumb rounded" src="./video-thumbnail-svgrepo-com.svg" alt="Miniatura del video 2" youtube="https://www.youtube.com/embed/VIDEO_ID">
                        </div>
                    </div>
                </div>
            </div>
            <!-- Controles de navegación -->
            <button class="carousel-control-prev" type="button" data-bs-target="#videoCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#videoCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>Contáctanos: <a href="mailto:contact@example.com" class="text-info">contact@example.com</a></p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./App.carousel.js"></script>
</body>
</html>
